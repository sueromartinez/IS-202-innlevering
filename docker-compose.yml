
services:

  # ========================================
  # MARIADB DATABASE
  # ========================================

  mariadb:
    image: mariadb:11.4
    container_name: beredskap-mariadb

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: beredskap_db
      MARIADB_USER: beredskap_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-beredskap_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-beredskap_root_dev_password}

    # Kun tilgjengelig fra egen PC.
    ports:
      - "127.0.0.1:3307:3306"

    # Databaseinnholdet overlever omstart
    # og gjenoppretting av containeren.
    volumes:
      - beredskap-db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ========================================
  # ASP.NET CORE MVC APPLICATION
  # ========================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: beredskap-app

    restart: unless-stopped

    # Vent til MariaDB er klar.
    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      # Kun lokal utvikling og demonstrasjon.
      # Demoinnlogging er aktiv i Development.
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >-
        Server=mariadb;
        Port=3306;
        Database=beredskap_db;
        User=beredskap_user;
        Password=${MARIADB_PASSWORD:-beredskap_dev_password};

    # Kun tilgjengelig fra egen PC.
    ports:
      - "127.0.0.1:8080:5216"

    # Behold ASP.NET Core Data Protection-nøkler
    # når app-containeren opprettes på nytt.
    volumes:
      - beredskap-dataprotection:/home/app/.aspnet/DataProtection-Keys


# ========================================
# PERSISTENT DOCKER VOLUMES
# ========================================

volumes:

  # Brukere, ressurser, behov og Identity-data.
  beredskap-db:

  # Nøkler til innloggingscookies og Data Protection.
  beredskap-dataprotection:
