services:

  mariadb:
    image: mariadb:11.4
    container_name: beredskap-mariadb

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: beredskap_db
      MARIADB_USER: beredskap_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - beredskap-db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: beredskap-app

    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >-
        Server=mariadb;
        Port=3306;
        Database=beredskap_db;
        User=beredskap_user;
        Password=${MARIADB_PASSWORD};

    ports:
      - "8080:8080"


volumes:
  beredskap-db: