services:

  mariadb:
    image: mariadb:11.4
    container_name: beredskap-mariadb

    restart: unless-stopped

    environment:
      MARIADB_DATABASE: beredskap_db
      MARIADB_USER: beredskap_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-beredskap_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-beredskap_root_dev_password}

    ports:
      - "3307:3306"

    volumes:
      - beredskap-db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: beredskap-app

    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: >-
        Server=mariadb;
        Port=3306;
        Database=beredskap_db;
        User=beredskap_user;
        Password=${MARIADB_PASSWORD:-beredskap_dev_password};

      # Admin-bruker (se .env.example)
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@beredskap.no}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-Admin123!}

      # Sami – AI-assistenten
      Sami__Provider: ${SAMI_PROVIDER:-Ollama}
      Sami__Ollama__BaseUrl: http://ollama:11434
      Sami__Ollama__Model: ${SAMI_OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # E-post går til Mailpit (se http://localhost:8025)
      Smtp__Host: mailpit
      Smtp__Port: 1025

    ports:
      - "8080:5216"


  # =========================================
  # OLLAMA – lokal språkmodell for Sami
  # =========================================
  ollama:
    image: ollama/ollama:latest
    container_name: beredskap-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Port 11434 åpnes også lokalt, så man kan kjøre appen
    # med "dotnet run" utenfor Docker og fortsatt bruke Sami.
    ports:
      - "11434:11434"


  # Laster ned modellen første gang (ca. 4–5 GB). Avslutter når den er ferdig.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: beredskap-ollama-pull
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Venter til Ollama svarer, og laster så ned modellen.
    entrypoint: ["/bin/sh", "-c", "until ollama list > /dev/null 2>&1; do sleep 2; done; ollama pull ${SAMI_OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"


  # =========================================
  # MAILPIT – test-e-postserver
  # Fanger alle e-poster: http://localhost:8025
  # =========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: beredskap-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"


volumes:
  beredskap-db:
  ollama-models: