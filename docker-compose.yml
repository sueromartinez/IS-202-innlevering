# docker-compose.yml – starter hele systemet med én kommando
#
# Hva filen gjør: docker compose up starter: mariadb (databasen), app (nettsiden), ollama
# (lokal AI-modell), ollama-pull (laster ned modellen) og mailpit (fanger e-post lokalt, se
# http://localhost:8025).
# Hvorfor Docker: alle får nøyaktig samme oppsett, og ingen trenger å installere databasen
# selv.
# Passord og API-nøkkel hentes fra .env, som ikke ligger i Git.
#
# Oppgavekrav: 1, 3, 7


# Docker Compose-oppsett for lokal utvikling og demonstrasjon.
# Passord og andre hemmeligheter hentes fra en lokal .env-fil.

services:

  #region MariaDB

  mariadb:
    image: mariadb:11.4
    container_name: beredskap-mariadb
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: beredskap_db
      MARIADB_USER: beredskap_user

      # Krev passord fra .env. Ingen kjente reservepassord.
      # Mangler variabelen i .env, nekter compose å starte. Det finnes ingen standardpassord i
      # koden.
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Sett MARIADB_PASSWORD i .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Sett MARIADB_ROOT_PASSWORD i .env}

    # Databasen er kun tilgjengelig fra vertsmaskinen.
    ports:
      # Databasen er bare tilgjengelig fra din egen maskin, ikke fra nettverket.
      - "127.0.0.1:3307:3306"

    # Beholder databaseinnhold ved omstart.
    volumes:
      - beredskap-db:/var/lib/mysql

    # Appen venter til databasen faktisk svarer, så tabellene ikke prøves laget før MariaDB er
    # klar.
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  #endregion

  #region ASP.NET Core

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: beredskap-app
    restart: unless-stopped

    # Start først når databasen er klar.
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_started

    environment:
      # Dette Compose-oppsettet er laget for lokal utvikling.
      # Et produksjonsmiljø må bruke et eget, herdet oppsett.
      ASPNETCORE_ENVIRONMENT: Development

      # Samme databasepassord brukes av MariaDB og EF Core.
      # Overstyrer databaseadressen i appsettings.json. Server=mariadb er navnet på tjenesten
      # over; containerne finner hverandre med navn.
      ConnectionStrings__DefaultConnection: >-
        Server=mariadb;
        Port=3306;
        Database=beredskap_db;
        User=beredskap_user;
        Password=${MARIADB_PASSWORD:?Sett MARIADB_PASSWORD i .env};

      # IdentitySeeder oppretter admin kun dersom
      # kontoen ikke allerede finnes i databasen.
      Seed__AdminEmail: ${ADMIN_EMAIL:?Sett ADMIN_EMAIL i .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Sett ADMIN_PASSWORD i .env}
      Seed__PublicActorPassword: ${PUBLIC_ACTOR_PASSWORD:-}

      # Sami kan bruke lokal Ollama eller konfigurert Claude.
      # Hvilken AI-modell Sami bruker. Sett SAMI_PROVIDER=Claude og ANTHROPIC_API_KEY i .env
      # for Claude.
      Sami__Provider: ${SAMI_PROVIDER:-Ollama}
      Sami__Ollama__BaseUrl: http://ollama:11434
      Sami__Ollama__Model: ${SAMI_OLLAMA_MODEL:-qwen2.5:7b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Mailpit mottar test-e-poster.
      Smtp__Host: mailpit
      Smtp__Port: 1025

    # Nettsiden er kun tilgjengelig fra vertsmaskinen.
    ports:
      - "127.0.0.1:8080:5216"

    # Behold Identity/Data Protection-nøkler ved omstart.
    volumes:
      # Nøklene som beskytter innloggingen lagres utenfor containeren, så ingen blir logget ut
      # når den bygges på nytt.
      - beredskap-dataprotection:/home/app/.aspnet/DataProtection-Keys

  #endregion

  #region Sami - lokal AI

  ollama:
    image: ollama/ollama:latest
    container_name: beredskap-ollama
    restart: unless-stopped

    # Modellen beholdes når containeren opprettes på nytt.
    volumes:
      - ollama-models:/root/.ollama

    # Tillater bruk av Ollama også fra dotnet run på vertsmaskinen.
    ports:
      - "127.0.0.1:11434:11434"

  # Laster ned modellen ved første oppstart.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: beredskap-ollama-pull

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434

    # Vent på Ollama før modellen lastes ned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until ollama list > /dev/null 2>&1;
        do sleep 2;
        done;
        ollama pull ${SAMI_OLLAMA_MODEL:-qwen2.5:7b}

    restart: "no"

  #endregion

  #region E-post - Mailpit

  mailpit:
    image: axllent/mailpit:latest
    container_name: beredskap-mailpit
    restart: unless-stopped

    # Test-e-poster vises på http://localhost:8025.
    ports:
      - "127.0.0.1:8025:8025"

  #endregion

#region Vedvarende Docker-volumer

volumes:

  # Database: brukere, roller, ressurser og behov.
  beredskap-db:

  # Nøkler for Identity-cookies og Data Protection.
  beredskap-dataprotection:

  # Nedlastede språkmodeller for Sami.
  ollama-models:

#endregion
